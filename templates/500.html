{% load i18n ui %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% translate "Server error | MediConnect" %}</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background:var(--ui-adaptive-soft,#F8F6EF); color:var(--ui-adaptive-ink,#292D28); font-family: "DM Sans", Arial, sans-serif; }
        main { max-width: 520px; padding: 40px; border: 1px solid #E8E6DC; border-radius: 16px;
               background:var(--ui-adaptive-paper,#fff); text-align: center; }
        .code { margin: 0; color:var(--ui-adaptive-ink,#596057); font-size: 14px; font-weight: 800; letter-spacing: 2px; }
        h1 { margin: 10px 0 12px; font-size: 30px; }
        p { color:var(--ui-adaptive-ink,#596057); line-height: 1.6; }
        a { display: inline-block; margin-top: 12px; padding: 11px 20px; border-radius: 8px;
            background: #294638; color: #fff; font-weight: 700; text-decoration: none; }
        a:focus-visible { outline: 3px solid #1f5f8b; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code">{% translate "ERROR 500" %}</p>
        <h1>{% translate "Something went wrong" %}</h1>
        <p>{% translate "An unexpected error occurred on our side. Please try again in a few minutes." %}</p>
        <a href="/">{% translate "Back to MediConnect" %}</a>
    </main>
</body>
</html>
