{% load i18n ui %}
{% if page_obj.has_other_pages %}<nav class="care-pagination" aria-label="{% translate "Pagination" %}">{% if page_obj.has_previous %}<a class="care-btn secondary" href="?q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;unread={% if unread_only %}1{% endif %}&amp;page={{ page_obj.previous_page_number }}">{% translate "Précédent" %}</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="care-btn secondary" href="?q={{ query|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;unread={% if unread_only %}1{% endif %}&amp;page={{ page_obj.next_page_number }}">{% translate "Suivant" %}</a>{% endif %}</nav>{% endif %}
