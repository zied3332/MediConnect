{% extends "consultations/base.html" %}{% block care_content %}<header class="care-hero"><div><span class="care-eyebrow">Messagerie</span><h1>Vos échanges, au même endroit.</h1><p>Retrouvez les conversations liées à vos consultations.</p></div><div class="care-orbit" aria-hidden="true">↔</div></header><form class="care-toolbar care-live-toolbar" method="get" data-live-search><div class="care-field"><label for="inbox-search">Rechercher une personne</label><input id="inbox-search" name="q" type="search" autocomplete="off" value="{{ query }}" placeholder="Nom du patient ou du médecin"></div><div class="care-field"><label for="unread-filter">Afficher</label><select name="unread" id="unread-filter"><option value="">Toutes les conversations</option value="1" {% if unread_only %}selected{% endif %}>Messages non lus</option></select></div><button class="care-search-reset" type="button" data-live-reset>Effacer</button><noscript><button class="care-btn" type="submit">Rechercher</button></noscript></form><p class="care-search-feedback" data-live-status role="status" aria-live="polite">Les résultats se mettent à jour pendant la saisie.</p><div data-live-results>{% include "consultations/inbox_results.html" %}</div>{% endblock %}
