
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==========================================
         MediConnect — Shared Base Template
         ========================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description"
          content="{% block meta_description %}MediConnect — Find doctors, book appointments, and access healthcare online.{% endblock %}">

    <meta name="theme-color" content="#F8F6EF">

    <!-- Page Title -->
    <title>{% block title %}MediConnect{% endblock %}</title>

    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- MediConnect Design System -->
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <!-- Page-Specific Styles -->
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Accessibility: Skip Navigation -->
    <a href="#main-content" class="mc-sr-only">
        Skip to main content
    </a>

    <!-- ==========================================
         Shared Navigation
         ========================================== -->
    <header id="site-header">
        {% block navigation %}
        <!-- Navbar component will be added in Commit 5 -->
        {% endblock %}
    </header>

    <!-- ==========================================
         Main Page Content
         ========================================== -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ==========================================
         Shared Footer
         ========================================== -->
    <footer id="site-footer">
        {% block footer %}
        <!-- Footer component will be added later -->
        {% endblock %}
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Page-Specific Scripts -->
    {% block extra_js %}{% endblock %}

</body>
</html>
