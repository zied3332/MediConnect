
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="MediConnect — Find doctors, book appointments, and access healthcare online.">

    <title>{% block title %}MediConnect{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Shared project styles (added in the next commit) -->
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Shared navigation will be added here -->
    <header id="site-header"></header>

    <!-- Page-specific content -->
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Shared footer will be added here -->
    <footer id="site-footer"></footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
