{% load i18n ui %}

<span class="mc-sidebar-icon" aria-hidden="true">
    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        focusable="false"
    >

        {% if icon == 'overview' %}

            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>

        {% elif icon == 'appointments' %}

            <rect x="3" y="5" width="18" height="16" rx="3"/>
            <path d="M7 3v4m10-4v4M3 11h18m-12 4h2m4 0h2"/>

        {% elif icon == 'consultations' %}

            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4V2h6v2M9 10h6m-6 4h6m-6 4h3"/>

        {% elif icon == 'messages' %}

            <path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 0 1-1-4 9 9 0 0 1 18-1Z"/>
            <path d="M7 11h10m-10 4h6"/>

        {% elif icon == 'reviews' %}

            <path d="m12 3 2.8 5.8 6.4.9-4.6 4.5 1.1 6.3-5.7-3-5.7 3 1.1-6.3-4.6-4.5 6.4-.9Z"/>

        {% elif icon == 'availability' %}

            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>

        {% elif icon == 'specialties' %}

            <path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z"/>

        {% elif icon == 'ai' %}

            <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/>

        {% elif icon == 'settings' %}

            <circle cx="12" cy="12" r="3"/>
            <path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/>

        {% elif icon == 'website' %}

            <path d="M14 3h7v7m0-7L10 14M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/>

        <!-- ======================================
             MEDICAL RECORDS MODULE
             ====================================== -->

        {% elif icon == 'medical_record' %}

            <!-- Medical document -->
            <path d="M8 3h8l4 4v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3Z"/>
            <path d="M15 3v5h5"/>

            <!-- Medical cross -->
            <path d="M12 11v7M8.5 14.5h7"/>

        {% elif icon == 'prescriptions' %}

            <!-- Prescription document -->
            <rect x="4" y="3" width="16" height="18" rx="2"/>

            <!-- Rx -->
            <path d="M8 9h4a2 2 0 0 1 0 4H8V9Z"/>
            <path d="m10 13 3 4"/>
            <path d="m15 14 4 4m0-4-4 4"/>

        {% elif icon == 'examinations' %}

            <!-- Medical file -->
            <path d="M7 3h9l4 4v5"/>
            <path d="M16 3v5h4"/>
            <path d="M7 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/>

            <!-- Magnifying glass -->
            <circle cx="16" cy="16" r="4"/>
            <path d="m19 19 3 3"/>

        {% else %}

            <!-- Default user icon -->
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>

        {% endif %}

    </svg>
</span>
