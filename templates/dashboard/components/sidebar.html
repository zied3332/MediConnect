
<aside class="mc-dashboard-sidebar" id="dashboard-sidebar">

        <span class="mc-dashboard-brand-icon" aria-hidden="true">+</span>

        <small>ADMIN</small>

        <!-- Overview -->
        <a
            href="{% url 'dashboard:overview' %}"
            class="mc-sidebar-link {% if request.resolver_match.url_name == 'overview' %}active{% endif %}"
            {% if request.resolver_match.url_name == 'overview' %}
                aria-current="page"
            {% endif %}
        >
            <span class="mc-sidebar-icon" aria-hidden="true">▦</span>
            <span>Overview</span>
        </a>

        <!-- Doctors -->
        <span class="mc-sidebar-link disabled">
            <span class="mc-sidebar-icon" aria-hidden="true">♙</span>
            <span>Doctors</span>

        <!-- Patients -->
        <span class="mc-sidebar-link disabled">
            <span class="mc-sidebar-icon" aria-hidden="true">♧</span>
            <span>Patients</span>
            <small>Soon</small>
        </span>

        <!-- Appointments -->
        <span class="mc-sidebar-link disabled">
            <span class="mc-sidebar-icon" aria-hidden="true">▣</span>
            <span>Appointments</span>
            <small>Soon</small>
        </span>

        <!-- Specialties -->
        <span class="mc-sidebar-link disabled">
            <span class="mc-sidebar-icon" aria-hidden="true">✚</span>
            <span>Specialties</span>
            <small>Soon</small>
        </span>

        <!-- Reviews -->
        <span class="mc-sidebar-link disabled">
            <span class="mc-sidebar-icon" aria-hidden="true">☆</span>
            <span>Reviews</span>
            <small>Soon</small>
        </span>

    </nav>

    <!-- Bottom navigation -->
    <div class="mc-sidebar-bottom">

        <!-- Settings -->
        <a
            href="{% url 'dashboard:settings' %}"
            class="mc-sidebar-link {% if request.resolver_match.url_name == 'settings' %}active{% endif %}"
            {% if request.resolver_match.url_name == 'settings' %}
                aria-current="page"
            {% endif %}
        >
            <span class="mc-sidebar-icon" aria-hidden="true">⚙</span>
            <span>Settings</span>
        </a>

        <!-- Public website -->
        <a href="{% url 'core:home' %}" class="mc-sidebar-link">
